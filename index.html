    <section id="celebration-wall-section">
        <h2>Leave Jay A Message</h2>
        <div id="CelebrationWall">
            <div style="text-align: center; margin-bottom: 30px;">
                <button id="toggle-form-btn" class="pill-button">Leave a Message</button>
            </div>

            <div class="post-form-container" id="post-form-wrapper" style="display: none;">
                <form id="post-form">
                    <input type="text" id="post-descriptor" placeholder="Name">
                    <textarea id="post-message" placeholder="Message text"></textarea>
                    <input type="file" id="post-avatar" accept="image/*">
                    <button type="button" id="post-message-btn">Post Message</button>
                </form>
            </div>

            <div id="message-feed" class="message-feed-container"></div>

            <div id="reactions-placeholder" class="reactions-placeholder"></div>
            <div id="replies-placeholder" class="replies-placeholder"></div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update, increment } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2OH7-Jsfm3jEBQSKWZIEesQQdY4DB_R4",
            authDomain: "jayclassof2026-7533b.firebaseapp.com",
            databaseURL: "https://jayclassof2026-7533b-default-rtdb.firebaseio.com",
            projectId: "jayclassof2026-7533b",
            storageBucket: "jayclassof2026-7533b.firebasestorage.app",
            messagingSenderId: "490543057620",
            appId: "1:490543057620:web:52056eed1dfa57c8cbc941"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'celebration_messages');

        // Manage delete token in localStorage
        let userDeleteToken = localStorage.getItem('jayMsgDeleteToken');
        if (!userDeleteToken) {
            userDeleteToken = 'token_' + Math.random().toString(36).substr(2, 9) + Date.now();
            localStorage.setItem('jayMsgDeleteToken', userDeleteToken);
        }

        // File reader to convert uploaded images to Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // Helper to escape HTML characters
        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Handle form visibility toggle
        const toggleFormBtn = document.getElementById('toggle-form-btn');
        const postFormWrapper = document.getElementById('post-form-wrapper');

        toggleFormBtn.addEventListener('click', () => {
            if (postFormWrapper.style.display === 'none' || !postFormWrapper.style.display) {
                postFormWrapper.style.display = 'block';
                toggleFormBtn.textContent = 'Cancel';
            } else {
                postFormWrapper.style.display = 'none';
                toggleFormBtn.textContent = 'Leave a Message';
            }
        });

        // Handle posting new messages
        const postBtn = document.getElementById('post-message-btn');
        postBtn.addEventListener('click', async () => {
            const descriptorInput = document.getElementById('post-descriptor');
            const messageInput = document.getElementById('post-message');
            const avatarInput = document.getElementById('post-avatar');

            const descriptor = descriptorInput.value.trim();
            const text = messageInput.value.trim();

            if (!text) {
                alert('Please enter a message text.');
                return;
            }

            postBtn.disabled = true;
            postBtn.textContent = 'Posting...';

            let avatarBase64 = null;
            if (avatarInput.files && avatarInput.files.length > 0) {
                try {
                    avatarBase64 = await fileToBase64(avatarInput.files[0]);
                } catch (e) {
                    console.error("Error reading file:", e);
                }
            }

            try {
                const newMessageRef = push(messagesRef);
                await set(newMessageRef, {
                    descriptor: descriptor || 'Anonymous',
                    text: text,
                    avatar: avatarBase64,
                    timestamp: Date.now(),
                    deleteToken: userDeleteToken
                });

                // Clear form inputs after successful post
                descriptorInput.value = '';
                messageInput.value = '';
                avatarInput.value = '';
            } catch (error) {
                console.error("Error posting message:", error);
                alert("Failed to post message. See console for details.");
            } finally {
                postBtn.disabled = false;
                postBtn.textContent = 'Post Message';

                // Hide form after successful post attempt
                postFormWrapper.style.display = 'none';
                toggleFormBtn.textContent = 'Leave a Message';
            }
        });

        // Realtime DB listener for the message feed
        const feedContainer = document.getElementById('message-feed');
        onValue(messagesRef, (snapshot) => {
            feedContainer.innerHTML = '';
            const data = snapshot.val();
            if (!data) return;

            // Convert to array and sort by newest first
            const messages = Object.entries(data).map(([id, msg]) => ({ id, ...msg }));
            messages.sort((a, b) => b.timestamp - a.timestamp);

            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message-item';

                // Display Avatar base64
                if (msg.avatar) {
                    const img = document.createElement('img');
                    img.src = msg.avatar;
                    img.alt = 'Avatar';
                    img.style.maxWidth = '100px';
                    msgDiv.appendChild(img);
                }

                // Display Descriptor and Timestamp
                const headerP = document.createElement('p');
                const dateHeader = new Date(msg.timestamp).toLocaleString();
                headerP.innerHTML = `<strong>${escapeHTML(msg.descriptor)}</strong> - <em>${dateHeader}</em>`;
                msgDiv.appendChild(headerP);

                // Display Message Text
                const textP = document.createElement('p');
                textP.textContent = msg.text;
                msgDiv.appendChild(textP);

                // Add Reactions
                const reactionsDiv = document.createElement('div');
                reactionsDiv.className = 'reactions-container';

                const reactions = msg.reactions || { heart: 0, celebrate: 0, clap: 0 };
                ['heart', 'celebrate', 'clap'].forEach(type => {
                    const reactBtn = document.createElement('button');
                    reactBtn.textContent = `${type} (${reactions[type] || 0})`;
                    reactBtn.className = 'reaction-btn';
                    reactBtn.addEventListener('click', () => {
                        update(ref(db, `celebration_messages/${msg.id}/reactions`), {
                            [type]: increment(1)
                        });
                    });
                    reactionsDiv.appendChild(reactBtn);
                });
                msgDiv.appendChild(reactionsDiv);

                // Add Replies
                const repliesContainer = document.createElement('div');
                repliesContainer.className = 'replies-container';

                if (msg.replies) {
                    const replyEntries = Object.entries(msg.replies).sort((a, b) => a[1].timestamp - b[1].timestamp);
                    replyEntries.forEach(([replyId, replyData]) => {
                        const replyDiv = document.createElement('div');
                        replyDiv.className = 'reply-item';

                        const rText = document.createElement('p');
                        const rDate = new Date(replyData.timestamp).toLocaleString();
                        rText.innerHTML = `<em>${rDate}</em> - ${escapeHTML(replyData.text)}`;

                        const rDelBtn = document.createElement('button');
                        rDelBtn.textContent = 'Delete Reply';
                        rDelBtn.addEventListener('click', () => {
                            if (replyData.deleteToken === userDeleteToken) {
                                if (confirm("Are you sure you want to delete your reply?")) {
                                    remove(ref(db, `celebration_messages/${msg.id}/replies/${replyId}`));
                                }
                            } else {
                                const adminKey = prompt("Enter admin key to delete this reply:");
                                if (adminKey === 'JAY-ADMIN-2026') {
                                    remove(ref(db, `celebration_messages/${msg.id}/replies/${replyId}`));
                                } else if (adminKey !== null) {
                                    alert("Incorrect admin key or unauthorized.");
                                }
                            }
                        });

                        replyDiv.appendChild(rText);
                        replyDiv.appendChild(rDelBtn);
                        repliesContainer.appendChild(replyDiv);
                    });
                }

                // Reply Input Form
                const replyForm = document.createElement('div');
                replyForm.className = 'reply-form';
                replyForm.style.display = 'none'; // Hidden by default

                const replyInput = document.createElement('input');
                replyInput.type = 'text';
                replyInput.placeholder = 'Write a reply...';

                const replySubmitBtn = document.createElement('button');
                replySubmitBtn.textContent = 'Reply';
                replySubmitBtn.addEventListener('click', () => {
                    const replyText = replyInput.value.trim();
                    if (!replyText) return;

                    push(ref(db, `celebration_messages/${msg.id}/replies`), {
                        text: replyText,
                        timestamp: Date.now(),
                        deleteToken: userDeleteToken
                    });
                    replyInput.value = '';
                });

                replyForm.appendChild(replyInput);
                replyForm.appendChild(replySubmitBtn);

                msgDiv.appendChild(repliesContainer);
                msgDiv.appendChild(replyForm);

                // Add Actions Container (Reply toggle + Delete)
                const actionsContainer = document.createElement('div');
                actionsContainer.style.marginTop = '10px';
                actionsContainer.style.display = 'flex';
                actionsContainer.style.gap = '15px';
                actionsContainer.style.alignItems = 'center';

                const toggleReplyBtn = document.createElement('button');
                toggleReplyBtn.textContent = 'Reply';
                toggleReplyBtn.style.background = 'transparent';
                toggleReplyBtn.style.color = '#999';
                toggleReplyBtn.style.border = 'none';
                toggleReplyBtn.style.cursor = 'pointer';
                toggleReplyBtn.style.padding = '0';
                toggleReplyBtn.style.textDecoration = 'underline';
                toggleReplyBtn.style.fontSize = '0.8rem';

                toggleReplyBtn.addEventListener('mouseover', () => toggleReplyBtn.style.color = 'var(--archer-red)');
                toggleReplyBtn.addEventListener('mouseout', () => toggleReplyBtn.style.color = '#999');

                toggleReplyBtn.addEventListener('click', () => {
                    replyForm.style.display = replyForm.style.display === 'none' ? 'flex' : 'none';
                });

                // Display Delete Button with logic
                const delBtn = document.createElement('button');
                delBtn.textContent = 'Delete Message';
                delBtn.className = 'delete-message-btn';
                delBtn.style.marginTop = '0'; // reset inherited margin since it's in a flex row
                delBtn.addEventListener('click', () => {
                    if (msg.deleteToken === userDeleteToken) {
                        if (confirm("Are you sure you want to delete your message?")) {
                            remove(ref(db, `celebration_messages/${msg.id}`));
                        }
                    } else {
                        const adminKey = prompt("Enter admin key to delete this message:");
                        if (adminKey === 'JAY-ADMIN-2026') {
                            remove(ref(db, `celebration_messages/${msg.id}`));
                        } else if (adminKey !== null) {
                            alert("Incorrect admin key or unauthorized.");
                        }
                    }
                });

                actionsContainer.appendChild(toggleReplyBtn);
                actionsContainer.appendChild(delBtn);
                msgDiv.appendChild(actionsContainer);

                feedContainer.appendChild(msgDiv);
            });
        });
    </script>

    <script>
        const slides = document.querySelectorAll('.slide');
        let index = 0;

        function transitionSlides() {
            slides[index].classList.remove('active');
            index = (index + 1) % slides.length;
            slides[index].classList.add('active');
        }

        // Initialize carousel continuously matching transition speed
        setInterval(transitionSlides, 2000);
    </script>
