    <section id="celebration-wall-section">
        <h2>Leave Jay A Message</h2>
        <div id="CelebrationWall">
            <div style="text-align: center; margin-bottom: 30px;">
                <button id="toggle-form-btn" class="pill-button">Leave a Message</button>
            </div>

            <div class="post-form-container" id="post-form-wrapper" style="display: none;">
                <form id="post-form">
                    <input type="text" id="post-descriptor" placeholder="Name">
                    <textarea id="post-message" placeholder="Message text"></textarea>
                    <input type="file" id="post-avatar" accept="image/*">
                    <button type="button" id="post-message-btn">Post Message</button>
                </form>
            </div>

            <div id="message-feed" class="message-feed-container"></div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update, increment } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2OH7-Jsfm3jEBQSKWZIEesQQdY4DB_R4",
            authDomain: "jayclassof2026-7533b.firebaseapp.com",
            databaseURL: "https://jayclassof2026-7533b-default-rtdb.firebaseio.com",
            projectId: "jayclassof2026-7533b",
            storageBucket: "jayclassof2026-7533b.firebasestorage.app",
            messagingSenderId: "490543057620",
            appId: "1:490543057620:web:52056eed1dfa57c8cbc941"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'celebration_messages');

        let userDeleteToken = localStorage.getItem('jayMsgDeleteToken') || ('token_' + Math.random().toString(36).substr(2, 9) + Date.now());
        localStorage.setItem('jayMsgDeleteToken', userDeleteToken);

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        const toggleFormBtn = document.getElementById('toggle-form-btn');
        const postFormWrapper = document.getElementById('post-form-wrapper');

        toggleFormBtn.addEventListener('click', () => {
            const isHidden = postFormWrapper.style.display === 'none' || !postFormWrapper.style.display;
            postFormWrapper.style.display = isHidden ? 'block' : 'none';
            toggleFormBtn.textContent = isHidden ? 'Cancel' : 'Leave a Message';
        });

        const postBtn = document.getElementById('post-message-btn');
        postBtn.addEventListener('click', async () => {
            const descriptorInput = document.getElementById('post-descriptor');
            const messageInput = document.getElementById('post-message');
            const avatarInput = document.getElementById('post-avatar');
            const text = messageInput.value.trim();

            if (!text) return alert('Please enter a message text.');

            postBtn.disabled = true;
            postBtn.textContent = 'Posting...';

            let avatarBase64 = avatarInput.files[0] ? await fileToBase64(avatarInput.files[0]) : null;

            try {
                await set(push(messagesRef), {
                    descriptor: descriptorInput.value.trim() || 'Anonymous',
                    text: text,
                    avatar: avatarBase64,
                    timestamp: Date.now(),
                    deleteToken: userDeleteToken
                });
                descriptorInput.value = ''; messageInput.value = ''; avatarInput.value = '';
            } catch (error) {
                console.error(error);
            } finally {
                postBtn.disabled = false;
                postBtn.textContent = 'Post Message';
                postFormWrapper.style.display = 'none';
                toggleFormBtn.textContent = 'Leave a Message';
            }
        });

        const feedContainer = document.getElementById('message-feed');
        onValue(messagesRef, (snapshot) => {
            feedContainer.innerHTML = '';
            const data = snapshot.val();
            if (!data) return;
            Object.entries(data).sort((a, b) => b[1].timestamp - a[1].timestamp).forEach(([id, msg]) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message-item';
                if (msg.avatar) {
                    const img = document.createElement('img');
                    img.src = msg.avatar; img.style.maxWidth = '100px';
                    msgDiv.appendChild(img);
                }
                const headerP = document.createElement('p');
                headerP.innerHTML = `<strong>${escapeHTML(msg.descriptor)}</strong> - <em>${new Date(msg.timestamp).toLocaleString()}</em>`;
                msgDiv.appendChild(headerP);
                const textP = document.createElement('p');
                textP.textContent = msg.text;
                msgDiv.appendChild(textP);
                feedContainer.appendChild(msgDiv);
            });
        });
    </script>

    <script>
        const slides = document.querySelectorAll('.slide');
        let index = 0;
        setInterval(() => {
            slides[index].classList.remove('active');
            index = (index + 1) % slides.length;
            slides[index].classList.add('active');
        }, 2000);

        document.addEventListener('click', (e) => {
            const target = e.target.closest('a[href="#rsvp"]');
            if (target) {
                e.preventDefault();
                const rsvpElem = document.getElementById('rsvp');
                if (rsvpElem) rsvpElem.scrollIntoView({ behavior: 'smooth' });
                else window.location.href = 'rsvp.html#rsvp';
            }
        });
    </script>
